<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>YouWallet</title>
<meta name="description" content="Finanzas personales en pesos, guardadas solo en tu teléfono.">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YouWallet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap">
<style>
/* Layout: app de una columna (máx. 560px), cabecera fija arriba, barra de pestañas abajo, botón + flotante; hojas inferiores.
   Estilo: panel oscuro "carbón" con brillo cobre (referencia del usuario). Un solo tema oscuro, a propósito. */
:root{
  --bg:#0B0B0C; --surface:#141415; --surface-2:#1C1C1E; --ink:#F3F2F0; --muted:#8E8C89; --line:#252527;
  --accent:#DB5B14; --accent-2:#E84A45; --accent-soft:#2C1A10; --on-accent:#FFFFFF;
  --pos:#4CC38A; --pos-soft:#13281D; --neg:#F0605A; --neg-soft:#2E1514; --warn:#F0A04B; --warn-soft:#2D2012;
  --spend:#E84A45; --glow:rgba(219,91,20,.38);
  --card-grad:linear-gradient(160deg,#1B1B1D 0%,#121213 55%,#0F0F10 100%);
  --f-display:"Inter", -apple-system, "SF Pro Display", system-ui, sans-serif;
  --f-body:"Inter", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --f-num:"Inter", -apple-system, "SF Pro Display", system-ui, sans-serif;
  --r:20px; --r-sm:14px;
  color-scheme:dark;
}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
button,a,input,select,textarea,label{touch-action:manipulation}
input,select,textarea{font-size:16px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
header.top .brand{display:flex;flex-direction:column}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:transparent;border-style:dashed}
.hero{background:var(--accent);color:var(--on-accent);border:0;border-radius:18px;padding:18px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .big{font-family:var(--f-num);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.hero .sub{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb, var(--on-accent) 25%, transparent);font-size:13px}
.hero button{background:transparent;border:0;color:inherit;padding:0;text-align:left}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-family:var(--f-num);font-weight:600;white-space:nowrap;text-align:right}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dot.in{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.dot.out{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.dot.tr{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:12px 2px 6px;font-weight:600;text-transform:capitalize}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.pill.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);font-size:13.5px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--neg-soft);color:var(--neg)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert b{font-weight:700}

.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--neg)} .bar.ok>i{background:var(--pos)}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.danger.armed{background:var(--neg);color:var(--surface);border-color:var(--neg)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.inp, select.inp, textarea.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:16px;color:var(--ink);font-weight:500}
textarea.inp{resize:vertical;min-height:80px}
.inp.amount{font-family:var(--f-num);font-size:26px;font-weight:600;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--accent)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:26;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media (min-width:700px){ .fab{right:calc(50% - 280px + 8px)} }

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 10px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:min(92vw,480px);box-shadow:0 6px 24px rgba(0,0,0,.25)}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}

.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clip{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 18px;display:flex;flex-direction:column;gap:10px}
.clip::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--warn)}
.clip[data-estado="En edición"]::before{background:var(--accent)}
.clip[data-estado="Entregado"]::before{background:var(--pos)}
.clip[data-estado="Entregado"][data-pagado="false"]::before{background:var(--neg)}
.clip .name{font-weight:600;overflow-wrap:anywhere}
.clip .who{font-size:12px;color:var(--muted)}
.clip .nota{font-size:13px;color:var(--muted);font-style:italic}
.sel{font:600 13px var(--f-body);padding:6px 10px;border-radius:999px;border:1px solid transparent;font-size:16px}
.sel.s-Pendiente{background:var(--warn-soft);color:var(--warn)}
.sel.s-edicion{background:var(--accent-soft);color:var(--accent)}
.sel.s-Entregado{background:var(--pos-soft);color:var(--pos)}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;height:10px}
.track i{border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.track i.d{background:var(--pos);border-color:var(--pos)}
.track i.w{background:var(--accent-soft);border-color:var(--accent)}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.todo .n{font:600 13px var(--f-num);color:var(--warn);background:var(--warn-soft);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;grid-row:span 3}
.todo .rs{font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.notas{font-size:14px;background:var(--surface-2);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pinpad button{height:64px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-num);font-size:22px;font-weight:600}
.pindots{display:flex;gap:12px;justify-content:center}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:22px 14px;font-size:14px}
.small{font-size:12.5px}
.hr{height:1px;background:var(--line);margin:4px 0}

/* ===== estilo carbón + cobre ===== */
body{font-feature-settings:"cv11","ss01";letter-spacing:-.005em;background:
  radial-gradient(120% 60% at 110% -10%, rgba(219,91,20,.22), transparent 55%),
  radial-gradient(80% 40% at -20% 0%, rgba(255,255,255,.04), transparent 60%), var(--bg);background-attachment:fixed}
h1,h2,h3{font-variation-settings:"opsz" 32;font-weight:600;letter-spacing:-.025em}
h1{font-size:26px} h2{font-size:17px;font-weight:500;letter-spacing:-.015em}
.eyebrow{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;color:var(--muted)}
.num{font-feature-settings:"tnum";letter-spacing:-.02em}
header.top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.iconbtn{border-radius:999px;background:var(--surface-2);border-color:var(--line)}
.card,.list,.kpi,.clip,.todo{background:var(--card-grad);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card.flat{background:transparent;border-style:dashed;box-shadow:none}
.card-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink)}
.card-h .ic{width:22px;height:22px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.card-h .ic svg{width:13px;height:13px}
.hero{position:relative;overflow:hidden;color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:20px;
  background:radial-gradient(90% 120% at 100% 0%, rgba(219,91,20,.55) 0%, rgba(150,60,20,.22) 35%, transparent 70%), linear-gradient(160deg,#1A1A1C,#0F0F10)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>")}
.hero .eyebrow{opacity:1;color:#CFCAC4}
.hero .big{font-family:var(--f-display);font-variation-settings:"opsz" 32;font-weight:500;font-size:40px;letter-spacing:-.04em}
.hero .big .cents{color:var(--muted);font-size:.55em;letter-spacing:-.02em}
.hero .sub{border-top-color:rgba(255,255,255,.08)}
.hero .sub > button > div:first-child{color:var(--muted);opacity:1}
.kpi{border-radius:var(--r-sm);padding:12px}
.kpi .v{font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:-.03em;margin-top:6px}
.kpi .spark{display:flex;align-items:flex-end;gap:2px;height:18px;margin-top:8px}
.kpi .spark i{flex:1;border-radius:2px;background:currentColor;opacity:.9}
.list{border-radius:var(--r)}
.item{border-bottom-color:rgba(255,255,255,.05)}
.dot{border-radius:999px;background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.dot.in{background:var(--pos-soft);color:var(--pos)} .dot.out{background:var(--neg-soft);color:var(--neg)} .dot.tr{background:var(--accent-soft);color:var(--accent)}
.btn{border-radius:999px;background:var(--surface-2);border-color:var(--line)}
.btn.primary{background:linear-gradient(180deg,#E8692A,#C9500F);border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(219,91,20,.25)}
.btn.light{background:#F3F2F0;color:#0B0B0C;border-color:#F3F2F0}
.btn.danger{background:transparent}
.seg{border-radius:999px;background:var(--surface);}
.seg button{border-radius:999px}
.seg button[aria-pressed="true"]{background:#F3F2F0;color:#0B0B0C;box-shadow:none}
.inp, select.inp, textarea.inp{background:var(--surface-2);border-color:var(--line);border-radius:14px}
.inp.amount{font-family:var(--f-display);font-weight:500;letter-spacing:-.03em;font-size:30px}
.pill{border-radius:999px}
.alert{border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.alert.warn{background:linear-gradient(160deg,#241A10,#161210);color:#F3C38E;border-color:#3A2814}
.alert.bad{background:linear-gradient(160deg,#2A1413,#161010);color:#F59A94;border-color:#3E1C1A}
.alert.info{background:var(--card-grad);color:var(--ink)}
.alert.info b{color:var(--accent)}
.bar{background:var(--surface-2);border-color:transparent;height:7px}
.bar>i{background:linear-gradient(90deg,#C9500F,#E8692A)}
.bar.ok>i{background:var(--pos)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--neg)}
.stripes>i{background:repeating-linear-gradient(135deg,#E84A45 0 6px,#D23E39 6px 9px)}
nav.tabs{background:rgba(14,14,15,.82);border-top-color:var(--line)}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
.fab{border-radius:999px;background:linear-gradient(180deg,#E8692A,#C9500F);box-shadow:0 10px 30px rgba(219,91,20,.4)}
.sheet{background:#101011;border-top:1px solid var(--line)}
.sheet-bg{background:rgba(0,0,0,.6)}
.chip{background:var(--surface-2);border-color:var(--line)}
.chip[aria-pressed="true"]{background:#F3F2F0;color:#0B0B0C;border-color:#F3F2F0}
.toast{background:#F3F2F0;color:#0B0B0C}
.notas{background:var(--surface-2)}
.pinpad button{border-radius:999px;background:var(--surface-2)}
.pindots i.on{background:var(--accent);border-color:var(--accent)}
.legend i{border-radius:999px}
/* medidor de salud financiera */
.health{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center}
.health .gauge{position:relative}
.health .gauge .sc{position:absolute;left:0;right:0;top:38%;text-align:center}
.health .gauge .sc b{display:block;font-family:var(--f-display);font-weight:500;font-size:34px;letter-spacing:-.04em;line-height:1}
.health .gauge .sc span{font-size:11.5px;color:var(--muted)}
.health ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.health li{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}

<script>
"use strict";
/* Sin zoom: bloquea el pellizco (iOS) y el doble toque. */
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
document.addEventListener("touchmove", e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
let lastTouchEnd = 0;
document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTouchEnd < 300 && !e.target.closest("input,textarea,select")) e.preventDefault(); lastTouchEnd = now; }, { passive:false });
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COP = new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0,minimumFractionDigits:0});
const money = n => COP.format(Math.round(n || 0)).replace(/ /g," ");
const shortMoney = n => { const a = Math.abs(n), s = n < 0 ? "-" : ""; if (a >= 1e6) return s + "$" + (a/1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".", ",") + " M"; if (a >= 1e3) return s + "$" + Math.round(a/1e3) + " mil"; return s + "$" + Math.round(a); };
const dots = n => Math.round(n || 0).toLocaleString("es-CO");
const parseAmt = s => Number(String(s ?? "").replace(/[^\d]/g, "")) || 0;
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const daysIn = (y, m0) => new Date(y, m0 + 1, 0).getDate();
const monthKeyOf = s => String(s).slice(0, 7);
const curMonth = () => monthKeyOf(today());
const shiftMonth = (key, n) => { const [y,m] = key.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const monthRange = key => { const [y,m] = key.split("-").map(Number); return [`${key}-01`, `${key}-${pad(daysIn(y, m-1))}`]; };
const weekRange = s => { const d = parseISO(s); const wd = (d.getDay() + 6) % 7; const st = addDays(s, -wd); return [st, addDays(st, 6)]; };
const addMonthsISO = (s, n) => { const d = parseISO(s); const day = d.getDate(); const t = new Date(d.getFullYear(), d.getMonth() + n, 1); t.setDate(Math.min(day, daysIn(t.getFullYear(), t.getMonth()))); return iso(t); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const fmtDay = s => new Intl.DateTimeFormat("es-CO",{weekday:"short",day:"numeric",month:"short"}).format(parseISO(s)).replace(/\./g,"");
const fmtDate = s => new Intl.DateTimeFormat("es-CO",{day:"numeric",month:"short",year:"numeric"}).format(parseISO(s)).replace(/\./g,"");
const fmtMonth = key => new Intl.DateTimeFormat("es-CO",{month:"long",year:"numeric"}).format(parseISO(key + "-01"));
const fmtMonthShort = key => new Intl.DateTimeFormat("es-CO",{month:"short"}).format(parseISO(key + "-01")).replace(".","");
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2))).replace(/[^A-Za-z0-9_-]/g, "");
const byName = (a, b) => String(a.name).localeCompare(String(b.name), "es");
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };

const ACC_TYPES = { banco:"Cuenta bancaria", billetera:"Billetera digital", efectivo:"Efectivo", credito:"Tarjeta de crédito" };
const FREQ = { unica:"Una sola vez", semanal:"Semanal", quincenal:"Quincenal (15 y fin de mes)", mensual:"Mensual", anual:"Anual" };

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
};

/* ============ estado ============ */
const COLLS = ["accounts","txns","cats","budgets","goals","debts","bills","videos","proyectos"];
const S = { ready:false, settings:null, accounts:[], txns:[], cats:[], budgets:[], goals:[], debts:[], bills:[], videos:[], proyectos:[], lastSync:null };
const UI = { tab:"inicio", plan:"presupuestos", settings:null, f:{ q:"", type:"", acc:"", cat:"", month:"" }, locked:false, unlocked:false, cli:{ filtro:"Todos", open:{} }, pin:"" };

const accById = id => S.accounts.find(a => a.id === id);
const catById = id => S.cats.find(c => c.id === id);
const isTopCat = c => !c.parentId || !catById(c.parentId);
const topCatId = id => { const c = catById(id); if (!c) return ""; return isTopCat(c) ? c.id : c.parentId; };
const catName = id => { const c = catById(id); if (!c) return "Sin categoría"; if (isTopCat(c)) return c.name; return catById(c.parentId).name + " › " + c.name; };
const catFamily = id => { if (!id) return []; return [id, ...S.cats.filter(c => c.parentId === id).map(c => c.id)]; };
const activeAccounts = () => S.accounts.filter(a => !a.archived).sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || byName(a,b));
const sortedTxns = () => [...S.txns].sort((a,b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));

/* ============ cálculos ============ */
function accBalance(a){
  let b = Number(a.initial) || 0;
  for (const t of S.txns){
    const amt = Number(t.amount) || 0;
    if (t.accountId === a.id){ if (t.type === "ingreso") b += amt; else b -= amt; }
    if (t.type === "transferencia" && t.toAccountId === a.id) b += amt;
  }
  return b;
}
function totals(){
  let disponible = 0, tarjetas = 0;
  for (const a of S.accounts){ if (a.archived) continue; const b = accBalance(a); if (a.type === "credito") { if (b < 0) tarjetas += -b; } else disponible += b; }
  const debo = S.debts.filter(d => d.dir !== "medeben").reduce((s,d) => s + Math.max(0, debtBalance(d)), 0);
  const meDeben = S.debts.filter(d => d.dir === "medeben").reduce((s,d) => s + Math.max(0, debtBalance(d)), 0);
  return { disponible, tarjetas, debo, meDeben, deudas: tarjetas + debo };
}
function sumRange(from, to, type, catIds){
  let s = 0;
  for (const t of S.txns){
    if (t.type !== type || t.date < from || t.date > to) continue;
    if (catIds && !catIds.includes(t.catId)) continue;
    s += Number(t.amount) || 0;
  }
  return s;
}
function monthFlows(key){ const [f,t] = monthRange(key); const ing = sumRange(f,t,"ingreso"), gas = sumRange(f,t,"gasto"); return { ing, gas, ahorro: ing - gas, tasa: ing > 0 ? (ing - gas) / ing : null }; }
function spendByTopCat(from, to){
  const m = {};
  for (const t of S.txns){ if (t.type !== "gasto" || t.date < from || t.date > to) continue; const k = topCatId(t.catId) || "_"; m[k] = (m[k] || 0) + (Number(t.amount) || 0); }
  return Object.entries(m).map(([id, v]) => ({ id, name: id === "_" ? "Sin categoría" : catName(id), v })).sort((a,b) => b.v - a.v);
}
function avgMonthlySpend(n = 3){
  const now = curMonth(); let sum = 0, months = 0;
  for (let i = 1; i <= n; i++){ const k = shiftMonth(now, -i); const [f,t] = monthRange(k); const g = sumRange(f,t,"gasto"); if (g > 0){ sum += g; months++; } }
  if (!months){ const [f] = monthRange(now); return sumRange(f, today(), "gasto"); }
  return sum / months;
}
function debtBalance(d){ return (Number(d.initial) || 0) - (d.payments || []).reduce((s,p) => s + (Number(p.amt) || 0), 0); }
function goalSaved(g){ return (g.moves || []).reduce((s,m) => s + (Number(m.amt) || 0), 0); }

/* presupuestos */
function budgetRange(b){ return b.period === "semana" ? weekRange(today()) : monthRange(curMonth()); }
function budgetUse(b, extraTxn){
  const [f,t] = budgetRange(b);
  const ids = b.catId === "*" ? null : catFamily(b.catId);
  let used = sumRange(f, t, "gasto", ids);
  if (extraTxn) used += extraTxn;
  const pct = b.limit > 0 ? used / b.limit : 0;
  return { used, pct, left: b.limit - used, level: pct >= 1 ? "bad" : pct >= 0.8 ? "warn" : "ok" };
}
function budgetLabel(b){ return b.catId === "*" ? "Todos los gastos" : catName(b.catId); }
function budgetRecommendations(){
  const now = curMonth(); const sums = {}; let monthsWithData = 0;
  for (let i = 1; i <= 3; i++){ const [f,t] = monthRange(shiftMonth(now,-i)); const rows = spendByTopCat(f,t); if (rows.length) monthsWithData++; for (const r of rows){ if (r.id === "_") continue; sums[r.id] = (sums[r.id] || 0) + r.v; } }
  if (!monthsWithData) return [];
  return Object.entries(sums).map(([id, v]) => ({ id, name: catName(id), avg: v / monthsWithData, sug: Math.ceil((v / monthsWithData) / 10000) * 10000 }))
    .filter(r => !S.budgets.some(b => b.catId === r.id && b.period !== "semana")).sort((a,b) => b.avg - a.avg).slice(0, 6);
}

/* calendario */
function occurrences(b, from, to){
  const out = []; if (!b.start) return out;
  const f = b.freq || "mensual";
  if (f === "unica"){ if (b.start >= from && b.start <= to) out.push(b.start); return out; }
  if (f === "semanal"){
    let d = b.start;
    if (d < from){ const diff = daysBetween(d, from); d = addDays(d, Math.floor(diff/7)*7); }
    while (d <= to){ if (d >= from && d >= b.start) out.push(d); d = addDays(d, 7); }
    return out;
  }
  const startDay = parseISO(b.start).getDate(); const startMonth = parseISO(b.start).getMonth();
  let k = monthKeyOf(from); const endK = monthKeyOf(to); let guard = 0;
  while (k <= endK && guard++ < 60){
    const [y, m] = k.split("-").map(Number); const dim = daysIn(y, m-1);
    let dates = [];
    if (f === "quincenal") dates = [`${k}-15`, `${k}-${pad(dim)}`];
    else if (f === "mensual") dates = [`${k}-${pad(Math.min(startDay, dim))}`];
    else if (f === "anual" && m-1 === startMonth) dates = [`${k}-${pad(Math.min(startDay, dim))}`];
    for (const d of dates) if (d >= from && d <= to && d >= b.start) out.push(d);
    k = shiftMonth(k, 1);
  }
  return out;
}
function monthlyDayDates(day, from, to){
  const out = []; if (!day) return out; let k = monthKeyOf(from); const endK = monthKeyOf(to); let g = 0;
  while (k <= endK && g++ < 60){ const [y,m] = k.split("-").map(Number); const d = `${k}-${pad(Math.min(Number(day), daysIn(y, m-1)))}`; if (d >= from && d <= to) out.push(d); k = shiftMonth(k, 1); }
  return out;
}
function events(from, to){
  const ev = [];
  for (const b of S.bills){
    for (const d of occurrences(b, from, to)){
      const amt = Number(b.amount) || 0;
      ev.push({ key:`b:${b.id}:${d}`, date:d, name:b.name, amount: b.kind === "ingreso" ? amt : -amt, src:"bill", ref:b.id, paid:(b.paid || []).includes(d), kind:b.kind || "gasto" });
    }
  }
  for (const a of S.accounts){
    if (a.archived || a.type !== "credito") continue;
    const bal = accBalance(a);
    for (const d of monthlyDayDates(a.cutDay, from, to)) ev.push({ key:`c:${a.id}:${d}`, date:d, name:`Corte ${a.name}`, amount:0, src:"cut", ref:a.id, paid:false, info:true });
    if (bal < 0){
      const due = a.minPayment ? Math.min(Number(a.minPayment), -bal) : -bal;
      for (const d of monthlyDayDates(a.payDay, from, to)){
        const cutBefore = a.cutDay ? monthlyDayDates(a.cutDay, addDays(d, -40), addDays(d, -1)).pop() : null;
        const winStart = cutBefore ? addDays(cutBefore, 1) : addDays(d, -25);
        const abonado = S.txns.filter(t => t.type === "transferencia" && t.toAccountId === a.id && t.date <= d && t.date >= winStart).reduce((s,t) => s + (Number(t.amount) || 0), 0);
        const paid = abonado >= due;
        ev.push({ key:`p:${a.id}:${d}`, date:d, name:`Pago tarjeta ${a.name}`, amount:-due, src:"card", ref:a.id, paid, kind:"gasto" });
      }
    }
  }
  for (const db_ of S.debts){
    const bal = debtBalance(db_); if (bal <= 0 || !db_.dueDay || !db_.minPayment) continue;
    const amt = Math.min(Number(db_.minPayment), bal);
    for (const d of monthlyDayDates(db_.dueDay, from, to)){
      const paid = (db_.payments || []).some(p => p.d <= d && p.d >= addDays(d, -25));
      ev.push({ key:`d:${db_.id}:${d}`, date:d, name: (db_.dir === "medeben" ? "Te paga: " : "Cuota: ") + db_.name, amount: db_.dir === "medeben" ? amt : -amt, src:"debt", ref:db_.id, paid, kind: db_.dir === "medeben" ? "ingreso" : "gasto" });
    }
  }
  return ev.sort((a,b) => a.date.localeCompare(b.date) || a.amount - b.amount);
}
function obligationsThisMonth(){
  const [f,t] = monthRange(curMonth());
  const ev = events(f, t).filter(e => e.amount < 0 && !e.paid);
  return { total: ev.reduce((s,e) => s - e.amount, 0), ev };
}
function forecast(days = 60){
  const start = today(), end = addDays(start, days);
  const tot = totals();
  const overdue = events(addDays(start, -30), addDays(start, -1)).filter(e => !e.paid && !e.info);
  const ev = events(start, end).filter(e => !e.paid && !e.info);
  let bal = tot.disponible + overdue.reduce((s,e) => s + e.amount, 0);
  const pts = []; let min = { v: bal, d: start };
  const byDay = {}; for (const e of ev) (byDay[e.date] = byDay[e.date] || []).push(e);
  let inc = 0, out = 0;
  for (let i = 0; i <= days; i++){
    const d = addDays(start, i);
    for (const e of (byDay[d] || [])){ bal += e.amount; if (e.amount > 0 && i <= 30) inc += e.amount; if (e.amount < 0 && i <= 30) out -= e.amount; }
    pts.push({ d, v: bal });
    if (bal < min.v) min = { v: bal, d };
  }
  return { pts, min, inc30: inc, out30: out, start: tot.disponible, overdue };
}

/* deudas */
function simulateDebt(balance, ea, payment, extra = 0){
  const im = Math.pow(1 + (Number(ea) || 0)/100, 1/12) - 1;
  let b = Number(balance) || 0; const pay = (Number(payment) || 0) + (Number(extra) || 0);
  if (b <= 0) return { months:0, interest:0, rows:[], im, monthInt:0 };
  if (pay <= b * im + 0.5) return { never:true, im, monthInt: b * im };
  let months = 0, interest = 0; const rows = [];
  while (b > 0.5 && months < 600){ const i = b * im; const p = Math.min(pay, b + i); b = b + i - p; interest += i; months++; rows.push({ n:months, p, i, c:p - i, b:Math.max(0,b) }); }
  return { months, interest, rows, im, monthInt: (Number(balance)||0) * im };
}

/* metas */
function goalStats(g){
  const saved = goalSaved(g), target = Number(g.target) || 0, left = Math.max(0, target - saved);
  const pct = target > 0 ? Math.min(1, saved / target) : 0;
  let monthsLeft = null, needMonth = null, needWeek = null;
  if (g.deadline){ const days = daysBetween(today(), g.deadline); monthsLeft = days / 30.44; if (days > 0){ needMonth = left / Math.max(monthsLeft, 1/30.44); needWeek = left / Math.max(days/7, 1/7); } }
  const since = addDays(today(), -90);
  const recent = (g.moves || []).filter(m => m.d >= since && m.amt > 0).reduce((s,m) => s + m.amt, 0) / 3;
  const rate = Number(g.plan) > 0 ? Number(g.plan) : recent;
  const eta = left <= 0 ? today() : rate > 0 ? addDays(today(), Math.ceil(left / rate * 30.44)) : null;
  return { saved, target, left, pct, monthsLeft, needMonth, needWeek, rate, eta, late: eta && g.deadline && eta > g.deadline };
}

/* ============ almacenamiento en el teléfono (IndexedDB) ============ */
function errText(e){
  if (e && e.name === "QuotaExceededError") return "Se llenó el espacio del teléfono para la app. Haz una copia y borra movimientos viejos.";
  return "No se pudo guardar en el teléfono. Intenta de nuevo.";
}
const strip = o => JSON.parse(JSON.stringify(o));
const IDB_NAME = "youwallet", IDB_STORE = "kv";
let idb = null;
function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open(IDB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function idbGet(k){ return new Promise((res, rej) => { const q = idb.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
function idbSet(k, v){ return new Promise((res, rej) => { const tx = idb.transaction(IDB_STORE, "readwrite"); tx.objectStore(IDB_STORE).put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); }
async function persist(key){
  const v = key === "settings" ? S.settings : S[key];
  if (idb) return idbSet(key, v);
  try { localStorage.setItem("yw." + key, JSON.stringify(v)); } catch (e){ throw e; }
}
function changed(){ S.lastSync = Date.now(); schedule(); }
async function put(coll, obj){
  const id = obj.id || newId(); const rec = { ...strip(obj), id };
  const next = [...S[coll]]; const i = next.findIndex(x => x.id === id);
  if (i >= 0) next[i] = rec; else next.push(rec);
  S[coll] = next; await persist(coll); track(coll, [id]); changed(); return id;
}
async function putMany(coll, recs){
  const map = new Map(S[coll].map(x => [x.id, x]));
  for (const r of recs) if (r && r.id) map.set(r.id, strip(r));

async function syncPush(){
  const keys = Object.keys(SYNC.dirty); if (!keys.length) return;

    const chunk = keys.slice(i, i + 500).map(k => [k, SYNC.dirty[k]]);
    const rows = chunk.map(([k]) => { const j = k.indexOf(":"), coll = k.slice(0, j), id = k.slice(j + 1); const data = recData(coll, id); return { user_id: uid, coll, id, data, deleted: data === null }; });
    await sbFetch("/rest/v1/registros?on_conflict=user_id,coll,id", { method:"POST", headers:{ Prefer:"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows) });
    for (const [k, v] of chunk) if (SYNC.dirty[k] === v) delete SYNC.dirty[k];

const tsMs = s => Date.parse(String(s).replace(/(\.\d{3})\d+/, "$1"));
async function syncPull(){
  const since = SYNC.lastPull ? new Date(tsMs(SYNC.lastPull) - 10000).toISOString() : null;
  const touched = new Set(), maps = {}; let newest = SYNC.lastPull, offset = 0;
  for (;;){
    let q = `/rest/v1/registros?select=coll,id,data,deleted,updated_at&order=updated_at.asc,coll.asc,id.asc&limit=1000&offset=${offset}`;
    if (since) q += `&updated_at=gt.${encodeURIComponent(since)}`;
    const rows = await (await sbFetch(q)).json();
    for (const r of rows){
      if (!newest || tsMs(r.updated_at) > tsMs(newest)) newest = r.updated_at;
      if (SYNC.dirty[r.coll + ":" + r.id]) continue;
      if (r.coll === "settings"){
        const pin = S.settings && S.settings.pin;
        S.settings = r.deleted || !r.data ? null : { ...r.data, ...(pin ? { pin } : {}) };
        touched.add("settings"); continue;
      }
      if (!COLLS.includes(r.coll)) continue;
      const m = maps[r.coll] || (maps[r.coll] = new Map(S[r.coll].map(x => [x.id, x])));
      if (r.deleted || !r.data) m.delete(r.id); else m.set(r.id, { ...r.data, id: r.id });
      touched.add(r.coll);
    }
    if (rows.length < 1000) break;
    offset += 1000;
  }

async function hashPin(pin, saltHex){
  const salt = new Uint8Array(saltHex.match(/../g).map(h => parseInt(h, 16)));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt, iterations:150000, hash:"SHA-256" }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function healthScore(){
  const m = monthFlows(curMonth()), pm = monthFlows(shiftMonth(curMonth(), -1));
  const ref = m.ing > 0 ? m : pm;
  const tasa = ref.ing > 0 ? (ref.ing - ref.gas) / ref.ing : 0;

  const bs = S.budgets.map(budgetUse); const sPres = bs.length ? bs.filter(u => u.pct < 1).length / bs.length * 25 : 15;
  const t = totals(); const ingAvg = Math.max(ref.ing, 1);
  const sDeuda = t.deudas <= 0 ? 25 : Math.max(0, 1 - t.deudas / (ingAvg * 6)) * 25;
  const gasto = avgMonthlySpend() || 1; const meses = t.disponible / gasto;
  const sFondo = Math.max(0, Math.min(1, meses / 3)) * 25;
  return { score: Math.round(sAhorro + sPres + sDeuda + sFondo), tasa, presOk: bs.length ? `${bs.filter(u => u.pct < 1).length}/${bs.length}` : "—", deuda: t.deudas, meses };
}

function chartMonths(){
  const now = curMonth(); const ks = [5,4,3,2,1,0].map(i => shiftMonth(now, -i));
  const data = ks.map(k => ({ k, ...monthFlows(k) }));
  const max = Math.max(1, ...data.map(d => Math.max(d.ing, d.gas)));
  const step = niceStep(max / 3); const top = Math.ceil(max / step) * step;
  const W = 340, H = 170, L = 44, B = 22, T = 8, cw = (W - L - 4) / 6;
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = "";
  for (let v = 0; v <= top + 1; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--f-num)">${shortMoney(v).replace("$","")}</text>`;
  const bars = data.map((d, i) => { const x = L + i * cw + cw * 0.18, bw = cw * 0.3; return `<rect x="${x}" y="${y(d.ing)}" width="${bw}" height="${Math.max(0, y(0) - y(d.ing))}" rx="3" fill="url(#gIng)"><title>Ingresos ${money(d.ing)}</title></rect><rect x="${x + bw + 2}" y="${y(d.gas)}" width="${bw}" height="${Math.max(0, y(0) - y(d.gas))}" rx="3" fill="url(#gGas)"><title>Gastos ${money(d.gas)}</title></rect><text x="${L + i * cw + cw/2}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="${d.k === now ? "var(--ink)" : "var(--muted)"}" font-weight="${d.k === now ? 700 : 500}">${fmtMonthShort(d.k)}</text>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos seis meses"><defs><linearGradient id="gIng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EE7A3A"/><stop offset="1" stop-color="#B9480D"/></linearGradient><pattern id="gGas" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E84A45"/><rect width="2" height="6" fill="#C93A35"/></pattern></defs>${g}${bars}</svg>`;
}
function niceStep(x){ if (x <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

  </div>`, r => { const a = r.querySelector("#tx-amt"); if (!t.id) setTimeout(() => a.focus(), 250); });
}
function setTxType(v){
  document.getElementById("tx-type").value = v;
  document.querySelectorAll('[data-act="tx-type"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  document.getElementById("tx-to-w").hidden = v !== "transferencia";
  document.getElementById("tx-cat-w").hidden = v === "transferencia";
  document.getElementById("tx-acc-l").textContent = v === "transferencia" ? "Desde" : "Cuenta";
  if (v !== "transferencia") document.getElementById("tx-cat").innerHTML = catOptions(v, "");
}
async function saveTxn(id){
  const type = val("tx-type"), amount = amtVal("tx-amt");
  if (!amount) return toast("Escribe un monto.");
  const accountId = val("tx-acc"); if (!accountId) return toast("Elige una cuenta.");
  const t = { ...(id ? S.txns.find(x => x.id === id) : { createdAt: Date.now() }), type, amount, accountId, date: val("tx-date") || today(), note: val("tx-note").trim() };
  if (type === "transferencia"){ t.toAccountId = val("tx-to"); if (!t.toAccountId || t.toAccountId === accountId) return toast("Elige una cuenta de destino distinta."); delete t.catId; }
  else { t.catId = val("tx-cat"); delete t.toAccountId; }
  // alertas de presupuesto antes de guardar
  const msgs = [];
  if (type === "gasto" && !id){
    for (const b of S.budgets){
      const [f, to] = budgetRange(b); if (t.date < f || t.date > to) continue;
      if (b.catId !== "*" && !catFamily(b.catId).includes(t.catId)) continue;
      const before = budgetUse(b), after = budgetUse(b, amount);
      if (after.pct >= 1 && before.pct < 1) msgs.push(`Superaste el presupuesto de ${budgetLabel(b)}.`);
      else if (after.pct >= 0.8 && before.pct < 0.8) msgs.push(`Ya usaste el ${Math.round(after.pct*100)}% de ${budgetLabel(b)}.`);
    }
  }
  const ok = await safe(() => put("txns", t));
  if (ok){ closeSheet(); toast(msgs.length ? msgs.join(" ") : id ? "Movimiento actualizado" : "Movimiento registrado"); }
}

/* ---------- planear ---------- */
function viewPlan(){
  const p = UI.plan;
  return header("Planear", "Presupuestos, metas y deudas") + `<div class="stack">
    <div class="seg" role="group" aria-label="Sección">${[["presupuestos","Presupuestos"],["metas","Metas"],["deudas","Deudas"]].map(([k,l]) => `<button data-act="plan" data-v="${k}" aria-pressed="${p === k}">${l}</button>`).join("")}</div>
    ${p === "presupuestos" ? viewBudgets() : p === "metas" ? viewGoals() : viewDebts()}
  </div>`;
}
function viewBudgets(){
  const rec = budgetRecommendations();
  const groups = [["mes","Este mes"],["semana","Esta semana"]];
  let h = `<div class="row between"><p class="muted small grow">Pon un límite por categoría. Te aviso al llegar al 80% y al pasarte.</p><button class="btn small primary" data-act="new-budget">Nuevo</button></div>`;
  if (!S.budgets.length) h += `<div class="card flat empty">Aún no tienes presupuestos.</div>`;
  for (const [k, l] of groups){
    const list = S.budgets.filter(b => (b.period || "mes") === k);
    if (!list.length) continue;
    const [f, t] = k === "semana" ? weekRange(today()) : monthRange(curMonth());
    const totL = list.reduce((s,b) => s + b.limit, 0), totU = list.reduce((s,b) => s + budgetUse(b).used, 0);
    h += `<div class="section-h"><h3>${l}</h3><span class="muted small">${fmtDay(f)} – ${fmtDay(t)}</span></div><div class="list">` + list.map(b => {
      const u = budgetUse(b);
      return `<button class="item" data-act="edit-budget" data-id="${b.id}" style="flex-direction:column;align-items:stretch;gap:6px"><div class="row between"><span class="t">${esc(budgetLabel(b))}</span><span class="pill ${u.level}">${Math.round(u.pct*100)}%</span></div><div class="bar ${u.level === "ok" ? "" : u.level}"><i style="width:${Math.min(100, u.pct*100)}%"></i></div><div class="row between small muted"><span class="num">${money(u.used)} de ${money(b.limit)}</span><span class="num ${u.left < 0 ? "neg" : ""}">${u.left < 0 ? "Pasado " + money(-u.left) : "Quedan " + money(u.left)}</span></div></button>`;
    }).join("") + `<div class="item"><div class="grow t">Real vs presupuestado</div><div class="amt num">${money(totU)} / ${money(totL)}</div></div></div>`;
  }
  if (rec.length) h += `<div class="section-h"><h3>Sugeridos según tu historial</h3></div><p class="muted small">Promedio de tus últimos meses, redondeado.</p><div class="list">${rec.map(r => `<div class="item"><div class="grow"><div class="t">${esc(r.name)}</div><div class="s">Promedio ${money(r.avg)} al mes</div></div><button class="btn small" data-act="use-rec" data-cat="${r.id}" data-v="${r.sug}">Usar ${shortMoney(r.sug)}</button></div>`).join("")}</div>`;
  return h;
}

    <label class="f">Categoría<select class="inp" id="bu-cat"><option value="*" ${b.catId === "*" ? "selected" : ""}>Todos los gastos</option>${catOptions("gasto", b.catId, true)}</select></label>
    <label class="f">Periodo<select class="inp" id="bu-per"><option value="mes" ${b.period !== "semana" ? "selected" : ""}>Mensual</option><option value="semana" ${b.period === "semana" ? "selected" : ""}>Semanal (lunes a domingo)</option></select></label>

function viewGoals(){
  let h = `<div class="row between wrap"><p class="muted small grow">Define cuánto quieres juntar y para cuándo.</p><div class="row"><button class="btn small" data-act="new-efund">Fondo de emergencia</button><button class="btn small primary" data-act="new-goal">Nueva meta</button></div></div>`;
  if (!S.goals.length) return h + `<div class="card flat empty">Aún no tienes metas. Un buen primer paso es un fondo de emergencia de 3 a 6 meses de gastos.</div>`;
  const list = [...S.goals].sort((a,b) => (b.kind === "emergencia") - (a.kind === "emergencia") || (a.deadline || "9").localeCompare(b.deadline || "9"));
  h += `<div class="list">` + list.map(g => { const s = goalStats(g); return `<button class="item" data-act="goal" data-id="${g.id}" style="flex-direction:column;align-items:stretch;gap:6px"><div class="row between"><span class="t">${esc(g.name)}</span>${g.kind === "emergencia" ? `<span class="pill info">Emergencia</span>` : s.late ? `<span class="pill warn">Atrasada</span>` : s.pct >= 1 ? `<span class="pill ok">Lograda</span>` : ""}</div><div class="bar ok"><i style="width:${s.pct*100}%"></i></div><div class="row between small muted"><span class="num">${money(s.saved)} de ${money(s.target)}</span><span>${s.pct >= 1 ? "¡Completa!" : s.needMonth ? `${money(s.needMonth)}/mes` : s.eta ? `Llegas ${fmtDate(s.eta)}` : "Sin fecha"}</span></div></button>`; }).join("") + `</div>`;
  return h;
}

function goalSim(s, monthly){
  if (s.left <= 0) return `<p class="muted small">Ya cumpliste esta meta.</p>`;
  const rows = [0.75, 1, 1.5].map(f => { const m = Math.round(monthly * f); if (!m) return null; const months = s.left / m; const d = addDays(today(), Math.ceil(months * 30.44)); return { f, m, months, d }; }).filter(Boolean);
  if (!rows.length) return `<p class="muted small">Escribe un aporte mensual para ver la fecha.</p>`;
  return `<div class="tablewrap"><table><thead><tr><th>Aporte / mes</th><th>Meses</th><th>Llegas</th></tr></thead><tbody>${rows.map(r => `<tr${r.f === 1 ? ' style="font-weight:700"' : ""}><td class="num">${money(r.m)}</td><td class="num">${Math.ceil(r.months)}</td><td>${fmtDate(r.d)}${s.target && r.d > (s.deadline || "9999") ? "" : ""}</td></tr>`).join("")}</tbody></table></div>`;
}

  <div class="row between"><h3>Tus deudas</h3><button class="btn small primary" data-act="new-debt">Nueva deuda</button></div>`;
  const rows = [];
  for (const a of cards){ const b = -accBalance(a); rows.push(`<button class="item" data-act="debt-card" data-id="${a.id}"><div class="dot out">T</div><div class="grow"><div class="t">${esc(a.name)}</div><div class="s">Tarjeta${a.rateEA ? ` · ${a.rateEA}% E.A.` : ""}${a.payDay ? ` · paga el ${a.payDay}` : ""}</div></div><div class="amt ${b > 0 ? "neg" : ""}">${money(Math.max(0, b))}</div></button>`); }
  for (const d of S.debts){ const b = debtBalance(d); const kindL = d.kind === "prestamo" ? "Préstamo" : d.kind === "persona" ? "Con una persona" : "Deuda"; rows.push(`<button class="item" data-act="debt" data-id="${d.id}"><div class="dot ${d.dir === "medeben" ? "in" : "out"}">${d.dir === "medeben" ? "+" : "−"}</div><div class="grow"><div class="t">${esc(d.name)}</div><div class="s">${d.dir === "medeben" ? "Te debe" : kindL}${d.rateEA ? ` · ${d.rateEA}% E.A.` : ""}${d.dueDay ? ` · día ${d.dueDay}` : ""}</div></div><div class="amt ${d.dir === "medeben" ? "pos" : b > 0 ? "neg" : ""}">${money(Math.max(0,b))}</div></button>`); }
  h += rows.length ? `<div class="list">${rows.join("")}</div>` : `<div class="card flat empty">Sin deudas registradas. Las tarjetas de crédito aparecen aquí solas cuando las creas en Cuentas.</div>`;
  h += `<p class="muted small">Las tasas se escriben como efectiva anual (E.A.), como aparecen en tu extracto. Calculo el interés mensual equivalente.</p>`;
  return h;
}

function debtDetail(kind, id){
  let name, bal, ea, minP, isCard = kind === "card", d, a;
  if (isCard){ a = accById(id); if (!a) return; name = a.name; bal = Math.max(0, -accBalance(a)); ea = a.rateEA; minP = a.minPayment; }
  else { d = S.debts.find(x => x.id === id); if (!d) return; name = d.name; bal = Math.max(0, debtBalance(d)); ea = d.rateEA; minP = d.minPayment; }
  openSheet(name, `<div class="stack">

    </div>
    ${!isCard ? `<div class="row"><input class="inp amt num grow" id="dp-amt" inputmode="numeric" placeholder="Monto del abono" aria-label="Monto del abono"><button class="btn primary" data-act="dp-add" data-id="${d.id}">Registrar abono</button></div>

      <div id="ds-out">${debtSimHTML(bal, ea, Number(minP) || 0, 0)}</div>
    </div>

    <button class="btn block" data-act="${isCard ? "edit-account" : "debt-edit"}" data-id="${id}">${isCard ? "Editar tarjeta (tasa, cuota, fechas)" : "Editar deuda"}</button>
  </div>`, r => {
    const upd = () => { r.querySelector("#ds-out").innerHTML = debtSimHTML(bal, ea, parseAmt(r.querySelector("#ds-pay").value), parseAmt(r.querySelector("#ds-extra").value)); };
    r.querySelector("#ds-pay").addEventListener("input", upd); r.querySelector("#ds-extra").addEventListener("input", upd);
  });
}
function debtSimHTML(bal, ea, pay, extra){
  if (bal <= 0) return `<p class="muted small">No hay saldo pendiente.</p>`;
  if (!pay && !extra) return `<p class="muted small">Escribe una cuota para ver cuándo terminas de pagar.</p>`;
  const s = simulateDebt(bal, ea, pay, extra);
  if (s.never) return `<div class="alert bad">Con ${money(pay + extra)} al mes no cubres ni el interés (${money(s.monthInt)}). La deuda no bajaría.</div>`;
  const end = addMonthsISO(today(), s.months);
  let cmp = "";
  if (extra > 0){ const b = simulateDebt(bal, ea, pay, 0); if (!b.never) cmp = `<div class="alert info">Con el abono extra terminas <b>${b.months - s.months} meses antes</b> y te ahorras <b class="num">${money(b.interest - s.interest)}</b> en intereses.</div>`; }
  const rows = s.rows.slice(0, 24);

function eventRow(e){
  const late = !e.paid && e.date < today() && !e.info;
  const pill = e.info ? `<span class="pill">Corte</span>` : e.paid ? `<span class="pill ok">${e.amount > 0 ? "Recibido" : "Pagado"}</span>` : late ? `<span class="pill bad">Vencido</span>` : e.date <= addDays(today(), 3) ? `<span class="pill warn">Pronto</span>` : "";
  const action = e.info || e.paid ? "" : `<button class="btn small" data-act="ev-pay" data-key="${esc(e.key)}">${e.amount > 0 ? "Recibí" : "Pagué"}</button>`;
  return `<div class="item"><div class="grow"><div class="t">${esc(e.name)}</div><div class="s">${fmtDay(e.date)} ${pill}</div></div>${e.info ? "" : `<div class="amt ${e.amount > 0 ? "pos" : ""}">${e.amount > 0 ? "+" : "−"}${money(Math.abs(e.amount))}</div>`}${action}</div>`;
}
function chartFlow(fc, minB){
  const pts = fc.pts; const W = 340, H = 150, L = 44, B = 18, T = 8;
  const vals = pts.map(p => p.v); let lo = Math.min(0, minB, ...vals), hi = Math.max(...vals, minB, 1);
  if (hi === lo) hi = lo + 1;
  const step = niceStep((hi - lo) / 3); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => L + (W - L - 6) * i / (pts.length - 1), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = ""; for (let v = lo; v <= hi + 1; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--f-num)">${shortMoney(v).replace("$","")}</text>`;
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length-1).toFixed(1)},${y(lo)}L${x(0)},${y(lo)}Z`;
  const mi = pts.findIndex(p => p.d === fc.min.d);
  const ticks = [0, 15, 30, 45, 60].filter(i => i < pts.length).map(i => `<text x="${x(i)}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === 60 ? "end" : "middle"}" font-size="9.5" fill="var(--muted)">${i === 0 ? "hoy" : fmtDay(pts[i].d).split(" ").slice(1).join(" ")}</text>`).join("");
  const minLine = minB ? `<line x1="${L}" x2="${W}" y1="${y(minB)}" y2="${y(minB)}" stroke="var(--warn)" stroke-dasharray="4 3"/>` : "";
  const zero = lo < 0 ? `<line x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--neg)" stroke-width="1.2"/>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo previsto día a día">${g}<path d="${area}" fill="var(--accent)" opacity=".12"/>${zero}${minLine}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(mi)}" cy="${y(fc.min.v)}" r="4" fill="${fc.min.v < minB ? "var(--neg)" : "var(--accent)"}" stroke="var(--surface)" stroke-width="2"/>${ticks}</svg>`;
}

const V_ESTADOS = ["Pendiente","En edición","Entregado"];
const V_ORDEN = { "Pendiente":0, "En edición":1, "Entregado":2 };
const vNum = x => (x === null || x === undefined || x === "" || Number.isNaN(Number(x))) ? null : Number(x);
function cliStats(){
  const v = S.videos;
  return {
    debo: v.filter(x => x.estado !== "Entregado").length,
    deben: v.filter(x => x.estado === "Entregado" && !x.pagado).reduce((s,x) => s + (vNum(x.precio) || 0), 0),
    cobrado: v.filter(x => x.pagado).reduce((s,x) => s + (vNum(x.precio) || 0), 0),
    sinPrecio: v.filter(x => vNum(x.precio) === null).length
  };
}
function cliLedger(){
  const m = new Map();
  for (const v of S.videos){ const c = m.get(v.cliente) || { cliente:v.cliente, pend:0, deben:0, entregados:0 }; if (v.estado === "Entregado"){ c.entregados++; if (!v.pagado) c.deben += vNum(v.precio) || 0; } else c.pend++; m.set(v.cliente, c); }
  return [...m.values()].sort((a,b) => b.deben - a.deben || b.pend - a.pend || String(a.cliente).localeCompare(String(b.cliente), "es"));
}
function proyAvance(p){
  const vs = S.videos.filter(v => v.proyecto === p.id);
  const hechos = vs.filter(v => v.estado === "Entregado").length, enCurso = vs.length - hechos;
  const total = Math.max(vNum(p.total) || 0, vs.length);
  return { hechos, enCurso, total, faltan: Math.max(total - hechos, 0) };
}
function cobroMsg(cliente){
  const deuda = S.videos.filter(v => v.cliente === cliente && v.estado === "Entregado" && !v.pagado).sort((a,b) => String(a.creado || "").localeCompare(String(b.creado || "")));

  const items = deuda.map(v => `${v.video} a ${vNum(v.precio) === null ? "precio por definir" : money(vNum(v.precio))}`);
  const lista = items.length === 1 ? items[0] : items.slice(0,-1).join(", ") + " y " + items[items.length-1];

/* exportar / copias */
async function offerFile(filename, data, mime){
  const blob = new Blob([data], { type:mime });
  try {
    const file = new File([blob], filename, { type:mime });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:filename }); return true; }
  } catch (e){ if (e && e.name === "AbortError") return false; }
  const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast("Archivo descargado"); return true;
}
function backupJSON(){ const o = { app:"youwallet", version:1, exportedAt:new Date().toISOString(), settings: S.settings ? (({ pin, ...r }) => r)(S.settings) : null }; for (const c of COLLS) o[c] = S[c]; return JSON.stringify(o, null, 1); }
function csvTxns(){
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const rows = [["fecha","tipo","monto","cuenta","cuenta_destino","categoria","nota"]];
  for (const t of sortedTxns()) rows.push([t.date, t.type, t.amount, accById(t.accountId)?.name || "", accById(t.toAccountId)?.name || "", t.type === "transferencia" ? "" : catName(t.catId), t.note || ""]);
  return "﻿" + rows.map(r => r.map(q).join(";")).join("\n");
}
async function restore(file){
  let o; try { o = JSON.parse(await file.text()); } catch { return toast("Ese archivo no es una copia válida."); }
  if (o.app !== "youwallet" && o.app !== "mis-finanzas") return toast("Ese archivo no es una copia de esta app.");
  const n = COLLS.reduce((s,c) => s + (Array.isArray(o[c]) ? o[c].length : 0), 0);
  openSheet("Restaurar copia", `<div class="stack"><p>La copia del ${esc(fmtDate(String(o.exportedAt).slice(0,10)))} tiene ${n} registros. Se agregan o reemplazan los registros con el mismo identificador; lo que tengas y no esté en la copia se conserva.</p><button class="btn primary block" id="doRestore">Restaurar</button><p class="small muted" id="restoreMsg"></p></div>`, r => {
    r.querySelector("#doRestore").addEventListener("click", async e => {
      e.target.disabled = true;
      let i = 0;
      const ok = await safe(async () => {
        for (const c of COLLS){ if (!Array.isArray(o[c])) continue; await putMany(c, o[c].filter(d => d && d.id)); i += o[c].length; }
        if (o.settings) await putSettings(o.settings);
      });
      if (ok){ closeSheet(); toast(`Copia restaurada (${i} registros)`); } else e.target.disabled = false;
    });
  });
}
async function wipeAll(btn){
  if (val("wipe-txt").trim().toUpperCase() !== "BORRAR") return toast("Escribe BORRAR para confirmar.");
  btn.disabled = true;
  if (SYNC.session) trackAll();
  const ok = await safe(async () => { for (const c of COLLS){ S[c] = []; await persist(c); } await setSettings(null); });
  if (ok){ UI.settings = null; UI.tab = "inicio"; toast("Datos borrados"); } else btn.disabled = false;

    case "cv-new": videoForm(); break;
    case "cv-edit": videoForm(S.videos.find(v => v.id === id)); break;
    case "cv-save": { const cliente = val("cv-cli").trim(), video = val("cv-vid").trim(); if (!cliente || !video) return toast("Escribe el cliente y el nombre del video."); const ex = id ? S.videos.find(v => v.id === id) : null; const pr = amtVal("cv-precio"); const v = { ...(ex || { pagado:false, creado:new Date().toISOString() }), cliente, video, precio: val("cv-precio").trim() ? pr : null, estado: val("cv-estado"), proyecto: val("cv-proy") || null, nota: val("cv-nota").trim() }; if (await safe(() => put("videos", v), "Video guardado")) closeSheet(); break; }
    case "cv-del": arm(el, async () => { if (await safe(() => del("videos", id), "Video borrado")) closeSheet(); }); break;
    case "cv-pay": { const v = S.videos.find(x => x.id === id); if (v) videoPaySheet(v); break; }
    case "vp-save": { const v = S.videos.find(x => x.id === id); if (!v) break; const ok = await safe(async () => { if (el.dataset.mode === "txn"){ const acc = val("vp-acc"); if (!acc) throw new Error("sin cuenta"); await put("txns", { type:"ingreso", amount: vNum(v.precio), accountId: acc, catId: val("vp-cat"), date: val("vp-date") || today(), note: `${v.cliente}: ${v.video}`, createdAt: Date.now() }); } await put("videos", { ...v, pagado:true }); }, el.dataset.mode === "txn" ? "Pagado e ingreso registrado" : "Marcado como pagado"); if (ok) closeSheet(); break; }
    case "cp-new": proyForm(); break;
    case "cp-edit": proyForm(S.proyectos.find(p => p.id === id)); break;
    case "cp-toggle": UI.cli.open[id] = !UI.cli.open[id]; render(); break;
    case "cp-state": { const p = S.proyectos.find(x => x.id === id); safe(() => put("proyectos", { ...p, estado: p.estado === "Terminado" ? "Activo" : "Terminado" })); break; }
    case "cp-save": { const nombre = val("cp-nombre").trim(), cliente = val("cp-cli").trim(), total = Math.round(Number(val("cp-total")) || 0); if (!nombre || !cliente || total < 1) return toast("Ponle nombre, cliente y cuántos videos tiene."); const ex = id ? S.proyectos.find(p => p.id === id) : null; if (await safe(() => put("proyectos", { ...(ex || { estado:"Activo", creado:new Date().toISOString(), tareas:[] }), nombre, cliente, total }), "Proyecto guardado")) closeSheet(); break; }
    case "cp-del": arm(el, async () => { const ok = await safe(async () => { await del("proyectos", id); for (const v of S.videos.filter(v => v.proyecto === id)) await put("videos", { ...v, proyecto:null }); }, "Proyecto borrado"); if (ok) closeSheet(); }); break;
    case "cp-notas": { const p = S.proyectos.find(x => x.id === id); openSheet("Qué tener en cuenta", `<div class="stack"><label class="f">Indicaciones del proyecto<textarea class="inp" id="cp-notas-t" rows="8">${esc(p.notas || "")}</textarea></label><button class="btn primary block" data-act="cp-notas-save" data-id="${esc(id)}">Guardar</button></div>`); break; }
    case "cp-notas-save": { const p = S.proyectos.find(x => x.id === id); if (await safe(() => put("proyectos", { ...p, notas: val("cp-notas-t").trim() }), "Indicaciones guardadas")) closeSheet(); break; }
    case "ct-edit": { const p = S.proyectos.find(x => x.id === id); tareaForm(p, (p.tareas || []).find(t => t.id === el.dataset.t)); break; }
    case "ct-save": { const titulo = val("ct-titulo").trim(), resumen = val("ct-resumen").trim(), tid = el.dataset.t; if (!titulo) return toast("Ponle un título."); if (await saveTareas(id, ts => tid ? ts.map(x => x.id === tid ? { ...x, titulo, resumen } : x) : [...ts, { id:"t" + Date.now().toString(36), titulo, resumen, hecho:false }])) closeSheet(); break; }
    case "ct-done": saveTareas(id, ts => ts.map(x => x.id === el.dataset.t ? { ...x, hecho:true } : x)); break;
    case "ct-undo": saveTareas(id, ts => ts.map(x => x.id === el.dataset.t ? { ...x, hecho:false } : x)); break;
    case "ct-del": arm(el, () => saveTareas(id, ts => ts.filter(x => x.id !== el.dataset.t))); break;
    case "new-txn": txnForm(); break;
    case "new-transfer": txnForm({ type:"transferencia" }); break;
    case "edit-txn": txnForm(S.txns.find(t => t.id === id)); break;
    case "tx-type": setTxType(el.dataset.v); break;
    case "tx-save": saveTxn(id); break;
    case "tx-del": arm(el, async () => { if (await safe(() => del("txns", id), "Movimiento eliminado")) closeSheet(); }); break;
    case "acc-movs": UI.f = { q:"", type:"", acc:id, cat:"", month:"" }; UI.tab = "movs"; render(); window.scrollTo(0,0); break;
    case "oblig": { const ob = obligationsThisMonth(); openSheet("Obligaciones del mes", `<div class="stack"><p class="muted small">Pagos programados de ${fmtMonth(curMonth())} que aún no marcas como pagados.</p>${ob.ev.length ? `<div class="list">${ob.ev.map(eventRow).join("")}</div>` : `<div class="card flat empty">No tienes pagos pendientes este mes. Programa arriendo, servicios o cuotas en la Agenda.</div>`}<div class="row between"><b>Total</b><b class="num">${money(ob.total)}</b></div></div>`); break; }
    case "goto-debts": UI.tab = "plan"; UI.plan = "deudas"; render(); window.scrollTo(0,0); break;

    case "plan": UI.plan = el.dataset.v; render(); break;
    case "new-budget": budgetForm(); break;
    case "edit-budget": budgetForm(S.budgets.find(b => b.id === id)); break;
    case "use-rec": safe(() => put("budgets", { catId: el.dataset.cat, period:"mes", limit: Number(el.dataset.v) }), "Presupuesto creado"); break;
    case "bu-save": { const limit = amtVal("bu-lim"); if (!limit) return toast("Escribe el límite."); const b = { ...(id ? S.budgets.find(x => x.id === id) : {}), catId: val("bu-cat"), period: val("bu-per"), limit }; if (await safe(() => put("budgets", b), "Presupuesto guardado")) closeSheet(); break; }
    case "bu-del": arm(el, async () => { if (await safe(() => del("budgets", id), "Presupuesto eliminado")) closeSheet(); }); break;

    case "new-goal": goalForm(); break;
    case "new-efund": { const avg = avgMonthlySpend(); goalForm({ kind:"emergencia", name:"Fondo de emergencia", target: Math.ceil(avg * 6 / 50000) * 50000 || 0 }); break; }
    case "goal": goalDetail(id); break;
    case "goal-edit": goalForm(S.goals.find(g => g.id === id)); break;
    case "go-save": { const name = val("go-name").trim(), target = amtVal("go-target"); if (!name || !target) return toast("Escribe nombre y monto objetivo."); const ex = id ? S.goals.find(g => g.id === id) : null; const g = { ...(ex || { moves:[], createdAt: Date.now() }), name, target, deadline: val("go-deadline") || null, plan: amtVal("go-plan") || null, kind: val("go-kind") || "normal" }; if (!ex){ const init = amtVal("go-init"); if (init) g.moves = [{ d: today(), amt: init }]; } if (await safe(() => put("goals", g), "Meta guardada")) closeSheet(); break; }
    case "go-del": arm(el, async () => { if (await safe(() => del("goals", id), "Meta eliminada")) closeSheet(); }); break;
    case "gm-add": { const amt = amtVal("gm-amt"); if (!amt) return toast("Escribe un monto."); const g = S.goals.find(x => x.id === id); const sign = Number(el.dataset.sign); if (sign < 0 && amt > goalSaved(g)) return toast("No puedes retirar más de lo ahorrado."); const moves = [...(g.moves || []), { d: today(), amt: sign * amt }].slice(-300); if (await safe(() => put("goals", { ...g, moves }), sign > 0 ? "Aporte registrado" : "Retiro registrado")) setTimeout(() => goalDetail(id), 60); break; }

    case "new-debt": debtForm(); break;
    case "debt": debtDetail("debt", id); break;
    case "debt-card": debtDetail("card", id); break;
    case "debt-edit": debtForm(S.debts.find(d => d.id === id)); break;
    case "dd-dir": document.getElementById("de-dir").value = el.dataset.v; document.querySelectorAll('[data-act="dd-dir"]').forEach(b => b.setAttribute("aria-pressed", String(b === el))); break;
    case "de-save": { const name = val("de-name").trim(), initial = amtVal("de-init"); if (!name || !initial) return toast("Escribe nombre y saldo."); const day = Number(val("de-day")) || null; const rate = Number(String(val("de-rate")).replace(",", ".")) || null; const d = { ...(id ? S.debts.find(x => x.id === id) : { payments:[], createdAt: Date.now() }), name, initial, dir: val("de-dir"), kind: val("de-kind"), rateEA: rate, minPayment: amtVal("de-min") || null, dueDay: day && day >= 1 && day <= 31 ? day : null, note: val("de-note").trim() }; if (await safe(() => put("debts", d), "Deuda guardada")) closeSheet(); break; }
    case "de-del": arm(el, async () => { if (await safe(() => del("debts", id), "Deuda eliminada")) closeSheet(); }); break;
    case "dp-add": { const amt = amtVal("dp-amt"); if (!amt) return toast("Escribe el monto del abono."); const d = S.debts.find(x => x.id === id); const accId = val("dp-acc"); const payments = [...(d.payments || []), { d: today(), amt }].slice(-400);
      const ok = await safe(async () => { await put("debts", { ...d, payments }); if (accId){ const cat = d.dir === "medeben" ? S.cats.find(c => c.kind === "ingreso" && /otros ingresos/i.test(c.name)) : S.cats.find(c => c.kind === "gasto" && /deuda/i.test(c.name)); await put("txns", { type: d.dir === "medeben" ? "ingreso" : "gasto", amount: amt, accountId: accId, catId: cat?.id || "", date: today(), note: `Abono ${d.name}`, createdAt: Date.now() }); } }, "Abono registrado");
      if (ok) setTimeout(() => debtDetail("debt", id), 60); break; }
    case "card-pay": { const a = accById(id); txnForm({ type:"transferencia", toAccountId: id, accountId: activeAccounts().find(x => x.type !== "credito")?.id, amount: a.minPayment ? Math.min(a.minPayment, Math.max(0, -accBalance(a))) : Math.max(0, -accBalance(a)), note:`Pago ${a.name}` }); break; }

    case "new-bill": billForm(); break;
    case "edit-bill": billForm(S.bills.find(b => b.id === id)); break;
    case "bl-kind": document.getElementById("bl-kind").value = el.dataset.v; document.querySelectorAll('[data-act="bl-kind"]').forEach(b => b.setAttribute("aria-pressed", String(b === el))); document.getElementById("bl-cat").innerHTML = catOptions(el.dataset.v, ""); break;
    case "bl-save": { const name = val("bl-name").trim(), amount = amtVal("bl-amt"); if (!name || !amount) return toast("Escribe nombre y monto."); const b = { ...(id ? S.bills.find(x => x.id === id) : { paid:[], createdAt: Date.now() }), name, amount, kind: val("bl-kind"), freq: val("bl-freq"), start: val("bl-start") || today(), catId: val("bl-cat"), accountId: val("bl-acc") }; if (await safe(() => put("bills", b), "Programación guardada")) closeSheet(); break; }
    case "bl-del": arm(el, async () => { if (await safe(() => del("bills", id), "Programación eliminada")) closeSheet(); }); break;
    case "ev-pay": payEvent(el.dataset.key); break;
    case "ep-save": case "ep-skip": { const [, ref, date] = el.dataset.key.split(":"); const b = S.bills.find(x => x.id === ref); const paid = [...(b.paid || []), date].filter(d => d >= addDays(today(), -400)); const ok = await safe(async () => { if (act === "ep-save"){ const amount = amtVal("ep-amt"); if (!amount) throw { code:"invalid_argument" }; await put("txns", { type: b.kind === "ingreso" ? "ingreso" : "gasto", amount, accountId: val("ep-acc"), catId: b.catId || "", date: val("ep-date") || today(), note: b.name, createdAt: Date.now() }); } await put("bills", { ...b, paid }); }, b.kind === "ingreso" ? "Marcado como recibido" : "Marcado como pagado"); if (ok) closeSheet(); break; }


    case "st-save": safe(() => putSettings({ minBalance: amtVal("st-min") }), "Ajuste guardado"); break;
    case "new-account": accountForm(); break;
    case "edit-account": accountForm(accById(id)); break;
    case "ac-save": { const name = val("ac-name").trim(); if (!name) return toast("Ponle un nombre a la cuenta."); const type = val("ac-type"); const v = amtVal("ac-init"); const ex = id ? accById(id) : null; const a = { ...(ex || { createdAt: Date.now(), order: S.accounts.length }), name, type, initial: type === "credito" ? -v : v };
      if (type === "credito"){ const rate = Number(String(val("ac-rate")).replace(",", ".")) || null; const day = n => { const x = Number(n); return x >= 1 && x <= 31 ? x : null; }; Object.assign(a, { limit: amtVal("ac-limit") || null, rateEA: rate, minPayment: amtVal("ac-min") || null, cutDay: day(val("ac-cut")), payDay: day(val("ac-pay")) }); }
      if (await safe(() => put("accounts", a), "Cuenta guardada")) closeSheet(); break; }
    case "ac-archive": { const a = accById(id); if (await safe(() => put("accounts", { ...a, archived: !a.archived }), a.archived ? "Cuenta reactivada" : "Cuenta archivada")) closeSheet(); break; }
    case "ac-del": { const used = S.txns.some(t => t.accountId === id || t.toAccountId === id); if (used) return toast("Esta cuenta tiene movimientos. Archívala para ocultarla sin perder el historial."); arm(el, async () => { if (await safe(() => del("accounts", id), "Cuenta eliminada")) closeSheet(); }); break; }
    case "new-cat": catForm(); break;
    case "edit-cat": catForm(catById(id)); break;
    case "ca-save": { const name = val("ca-name").trim(); if (!name) return toast("Escribe un nombre."); const c = { ...(id ? catById(id) : {}), name, kind: val("ca-kind") }; const p = val("ca-parent"); if (!document.getElementById("ca-parent").disabled) c.parentId = p || null; if (await safe(() => put("cats", c), "Categoría guardada")) closeSheet(); break; }
    case "ca-del": arm(el, async () => { const ok = await safe(async () => { for (const k of S.cats.filter(c => c.parentId === id)) await put("cats", { ...k, parentId: null }); await del("cats", id); }, "Categoría eliminada"); if (ok) closeSheet(); }); break;

    case "pin-set": pinSetSheet(); break;
    case "pin-save": { const a = val("pin1"), b = val("pin2"); if (!/^\d{4}$/.test(a)) return toast("El PIN debe tener 4 dígitos."); if (a !== b) return toast("Los PIN no coinciden."); const salt = randHex(16); const hash = await hashPin(a, salt); if (await safe(() => putSettings({ pin: { salt, hash } }), "PIN activado")){ UI.unlocked = true; closeSheet(); } break; }
    case "pin-off": arm(el, () => safe(() => { const s = { ...S.settings }; delete s.pin; return setSettings(s); }, "PIN desactivado")); break;
    case "backup": if (await offerFile(`youwallet-copia-${today()}.json`, backupJSON(), "application/json")) putSettings({ lastBackup: Date.now() }); break;
    case "csv": offerFile(`youwallet-movimientos-${today()}.csv`, csvTxns(), "text/csv"); break;
    case "wipe": wipeAll(el); break;
  }
});
/* mantener presionado "Olvidé" para quitar el PIN */
let forgotTimer = null;
document.addEventListener("pointerdown", e => { const b = e.target.closest('[data-act="pin-forgot"]'); if (!b) return; forgotTimer = setTimeout(async () => { const s = { ...S.settings }; delete s.pin; s.updatedAt = Date.now(); if (await safe(() => setSettings(s), "PIN quitado")){ UI.locked = false; UI.unlocked = true; UI.pin = ""; UI.pinMsg = ""; render(); } }, 3000); });
["pointerup","pointercancel","pointerleave"].forEach(t => document.addEventListener(t, () => clearTimeout(forgotTimer)));

boot();
</script>
</body>
</html>
